const TR={"Darkness": "Darknessは、裏向きのカードとカードの向き・位置を利用して、情報を隠したまま盤面を操作するタイプです。裏向きカードの価値を変える効果、裏向きカードをShiftさせる効果、相手の裏向きカードへの干渉がまとまっており、「見えていない状態そのもの」をゲーム上の資源として扱うのが大きな特色です。 主な方向性：裏向き化・裏向き情報の操作・位置調整・相手への干渉", "Death": "Deathは、フィールド上のカードをDeleteすることに特化した除去型のプロトコルです。特定の値をまとめて削除したり、裏向きカードを削除したり、異なるラインからカードを取り除いたりする効果が集中しています。相手の構築したスタックを直接減らすことを主軸にした設計です。 主な方向性：Delete・特定値の除去・裏向きカード除去", "Fire": "Fireは、捨て札をコストとして扱いながら、Draw・Delete・Return・Flipを連鎖させるプロトコルです。特に複数の効果を順番に処理し、カードを反転させた結果として新しいMiddle効果を割り込ませるなど、「一つの行動から次の効果をつなげる」構造が目立ちます。 主な方向性：捨て札利用・効果連鎖・Flip／Delete／Return", "Gravity": "Gravityは、ライン間のカード移動とスタックの形成を中心にしたプロトコルです。カードを別ラインへShiftさせるだけでなく、山札からカードを特定ラインへ送り込む効果もあり、どのラインにどのカードを置くかを動かしながら盤面を組み替えていく性格を持ちます。 主な方向性：Shift・ライン間移動・スタック形成・山札からの配置", "Life": "Lifeは、複数ラインへカードを展開しながら、Flipと追加配置で盤面を増やしていく展開型のプロトコルです。カードを各ラインへ裏向きで置く効果や、Coverされることを起点とした効果があり、単一ラインだけでなくフィールド全体を使って進める設計が特徴です。 主な方向性：多ライン展開・追加配置・Coverを利用した効果", "Light": "Lightは、カードをFlipした結果から追加のDrawやRevealにつなげる、情報公開と手札補充を重視するプロトコルです。相手の手札を公開する効果も含まれており、「見えない情報を見える状態へ変える」ことに強く結び付いています。 主な方向性：Reveal・手札情報の公開・Draw・Flip", "Metal": "Metalは、ラインの状態を固定・制限しながら、相手の行動範囲を狭める性格が強いプロトコルです。裏向きでカードを置けなくする効果や、一定枚数以上のスタックをまとめてDeleteする効果があり、相手が盤面を広げること自体に圧力をかけます。 主な方向性：行動制限・ライン管理・大量Delete", "Plague": "Plagueは、相手にカードを捨てさせたり、特定ラインでのPlayを禁止したりする「相手の手数を削る」タイプです。捨て札を要求する効果と、相手側の盤面に制限をかける効果が組み合わされており、直接的な破壊よりも継続的な圧力に重点があります。 主な方向性：Discard強制・Play制限・相手の選択肢削減", "Psychic": "Psychicは、相手の手札やプロトコル配置に干渉する情報・手札操作型のプロトコルです。相手に複数枚のDiscardを要求したり、手札を公開させたり、プロトコルのRearrangeやカードのShiftを行わせたりするため、「相手の計画そのもの」を崩す効果が目立ちます。 主な方向性：手札干渉・手札公開・Rearrange・Shift", "Speed": "Speedは、カードのPlay・Draw・Shiftをテンポよく行うことを中心としたプロトコルです。自分のカードを動かしながら追加のカードを使い、条件次第ではCompileやカード移動と結び付けた効果も持ちます。盤面を静的に積み上げるより、カードを動かして状況を変えることに重点があります。 主な方向性：高速展開・Draw・Shift・柔軟な盤面変更", "Spirit": "Spiritは、RefreshやDrawを利用しながら、表向き／裏向きの切り替えとプロトコル配置の変更を行う柔軟型です。表向きカードのPlay条件を緩める効果や、プロトコルの位置をSwapする効果があり、通常の配置ルールを一時的に柔らかくしながら展開できます。 主な方向性：Refresh・Draw・柔軟なPlay・プロトコル位置変更", "Water": "Waterは、Flip・Return・Rearrangeを使って盤面を何度も組み替える再調整型のプロトコルです。自分のカードを戻したり、特定値のカードをまとめてReturnしたりできるため、一度作った盤面を固定するのではなく、状況に応じて再構成する性格が強く出ています。 主な方向性：Return・Rearrange・Flip・再構成", "Apathy": "Apathyは、表向きカードのMiddle効果を止めたり、カードをFlipしたりすることで、ラインの「活動量」を抑えるコントロール型です。特にMiddleコマンド無視という効果が明確で、相手が積み上げた能力をそのまま機能させない方向へ働きます。 主な方向性：Middle効果の抑制・Flip・ラインの機能低下", "Hate": "Hateは、相手だけでなく自分の盤面もDelete対象にし得る、極端な除去志向を持つプロトコルです。複数カードのDiscardとDeleteを連続して行う効果や、最も高い値・最も低い値を狙う効果があり、カードの量よりも「特定の一枚を確実に失わせる」ことに重点があります。 主な方向性：Delete・高値／低値の指定・Discardとの連動", "Love": "Loveは、相手にもDrawさせたり、手札をGive／Takeしたりすることで、プレイヤー間のカード資源を直接動かすプロトコルです。自分だけが得をする単純なドロー型ではなく、「相手へ渡すこと」や「相手の資源を受け取ること」を一つの効果として組み込んでいるのが特徴です。 主な方向性：Give／Take・手札交換・Draw・資源共有", "Chaos": "Chaosは、両者のプロトコル配置やカードの向きを入れ替えたり、複数ラインへ同時に干渉したりして、現在の盤面を不安定にするプロトコルです。単純な除去よりも、配置や手札を入れ替えて「今まで成立していた計画」を崩すことに重点があります。 主な方向性：Rearrange・多ラインFlip・手札の入れ替え・不確定化", "Clarity": "Clarityは、手札や山札の内容を見ながら必要な値のカードを探す、情報と選択精度を重視するプロトコルです。山札から特定Valueを探す効果、相手の手札公開、Trashの再利用などがあり、状況に応じて必要なカードへ近づく設計です。 主な方向性：Reveal・特定Value探索・手札公開・山札操作", "Corruption": "Corruptionは、カードの所有・配置・Returnなどを変則的に扱い、通常のプレイ位置やカード移動のルールに揺さぶりをかけるプロトコルです。相手側へも自分側へも影響が及ぶ効果があり、特定のカードを別領域へ追いやることで盤面を不安定にします。 主な方向性：Return・所有／配置への干渉・Discardとの連動", "Courage": "Courageは、自分と相手のラインの合計値を比較し、その比較結果を条件としてカードをDraw・Delete・Shift・Flipするプロトコルです。単独の絶対値だけではなく「相手より高いか低いか」という相対関係を利用する点が大きな特色です。 主な方向性：合計値比較・条件付きDraw／Delete／Shift", "Fear": "Fearは、相手のMiddleコマンドを止めたり、相手の手札を大きく捨てさせたり、カードをReturn・Shiftさせたりする抑圧型のプロトコルです。相手の選択肢を減らし、盤面や手札を強制的に変化させる効果が多く、直接的なプレイ妨害が中心になります。 主な方向性：Middle停止・大量Discard・Return・Shift", "Ice": "Iceは、カードの移動を許容しながら、特定カードをFlipできなくするなど、一部の状態を「凍結」する性質を持つプロトコルです。相手がラインへカードを置いたことをきっかけにDiscardさせる効果もあり、変化を止めつつ、必要なタイミングで位置を動かす設計です。 主な方向性：状態固定・Flip禁止・Shift・相手のPlayへの反応", "Luck": "Luckは、山札から引く・捨てる・宣言するという不確定要素を利用し、その結果に応じてカードをPlayまたはDeleteするプロトコルです。特定の値やプロトコルを宣言して結果が一致したときに効果を得るため、他のプロトコルよりも結果依存の振れ幅が大きい設計になっています。 主な方向性：山札依存・宣言・結果に応じたPlay／Delete", "Mirror": "Mirrorは、相手と自分の盤面を対応させるような効果が中心で、相手カードのMiddleコマンドを利用したり、同時にFlipしたりできます。相手の行動やカード配置をそのまま材料として扱うことが多く、自分だけで完結するより対戦相手の盤面に依存して機能する性格があります。 主な方向性：相手依存・Middle効果の利用・Swap／同時Flip", "Peace": "Peaceは、手札を大量に整理したり、カードを裏向きで展開したり、Discardしたことを後からDrawへつなげたりする資源調整型のプロトコルです。直接的な除去よりも、手札枚数と展開状態を整えながら盤面を組み立てることに重点があります。 主な方向性：手札整理・Discard→Draw・裏向き展開", "Smoke": "Smokeは、裏向きカードを複数ラインへ配置し、裏向きカードの枚数を利用してラインの状態を変えるプロトコルです。自分のカードをFlip・Shiftする効果もあり、「見えていないカードを増やして盤面を曖昧にする」方向に寄っています。 主な方向性：裏向き展開・多ライン配置・Flip／Shift", "Time": "Timeは、Trashと山札を往復させることで、過去に捨てたカードをもう一度ゲームへ戻すことに重点があります。TrashからのPlay、Trashを山札へ戻す処理、DrawとDiscardの交換などがあり、カード資源を一度使い切って終わりにせず循環させる性格が強いプロトコルです。 主な方向性：Trash再利用・山札再形成・資源循環", "War": "Warは、相手がDraw・Refresh・Compile・Discardなどを行ったことを直接トリガーにして干渉する、反応型のプロトコルです。相手の行動を待ってからDeleteやDiscardなどを返す効果が多く、「相手が何をしたか」によって自分の効果が強くなる設計です。 主な方向性：相手行動への反応・Discard／Delete・Compileへの介入"};
const SN={m1:'Main 1',a1:'Aux 1',m2:'Main 2'};
const PT={SHO:'移動する相手のカードを選択',SHSELF:'このカードを別ラインへ移動する',FD:'裏返す裏向きカードを選択',F:'裏返す(表⇄裏)カードを選択',FX:'裏返すカードを選択(このカード以外)',FO:'裏返す相手のカードを選択',FS:'裏返す自分のカードを選択',FOU:'裏返す相手の表向きカードを選択',DEL:'削除するカードを選択',DELD:'削除する裏向きカードを選択',DELL:'削除する値0〜1のカードを選択',RET:'持ち主の手札に戻すカードを選択',RETS:'手札に戻す自分のカードを選択',RETO:'相手の手札に戻すカードを選択',SH:'移動するカードを選択',SHA:'移動するカードを選択(このカード以外)',SHX:'移動する自分のカードを選択(このカード以外)',SHD:'移動する裏向きカードを選択',SHOD:'移動する相手の裏向きカードを選択'};
const FT={SHO:(e,x,p)=>x!=p,FD:e=>!e.u,F:()=>1,FX:(e,x,p,s)=>e.c!=s.sc,FO:(e,x,p)=>x!=p,FS:(e,x,p)=>x==p,FOU:(e,x,p)=>x!=p&&e.u,DEL:()=>1,DELD:e=>!e.u,DELL:e=>e.u&&C[e.c].v<2,RET:()=>1,RETS:(e,x,p)=>x==p,RETO:(e,x,p)=>x!=p,SH:()=>1,SHA:(e,x,p,s)=>e.c!=s.sc,SHX:(e,x,p,s)=>x==p&&e.c!=s.sc,SHD:e=>!e.u,SHOD:(e,x,p)=>x!=p&&!e.u};
const nm=x=>String(x).normalize('NFKC').trim().toLowerCase();
const opp=p=>p=='a'?'b':'a',ORD=['a','b','b','a','a','b'];
const sh=a=>{for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fu=(r,id)=>r.some(e=>e.u&&e.c==id);
const val=e=>e.u?C[e.c].v:2;
function tot(s,i,p){const st=s.ln[i][p],os=s.ln[i][opp(p)],d=st.filter(e=>!e.u).length;
 let t=st.reduce((a,e)=>a+(e.u?C[e.c].v:fu(st,'Darkness2')?4:2),0);
 if(fu(st,'Apathy0')||fu(st,'Smoke2'))t+=d*(fu(st,'Apathy0')+fu(st,'Smoke2'));
 if(fu(st,'Clarity0'))t+=s.hand[p].length;if(fu(st,'Mirror0'))t+=os.length;if(fu(os,'Metal0'))t-=2;return t}
const lg=(s,m)=>{s.log.push(m);s.log=s.log.slice(-10)};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const protos=sets=>[...new Set(Object.values(C).filter(c=>sets.includes(c.s)).map(c=>c.p))];

function blank(sets){return{gid:Math.random().toString(36).slice(2),names:{},ph:'wait',pool:protos(sets),pk:0,pr:{a:[],b:[]},deck:{a:[],b:[]},hand:{a:[],b:[]},dis:{a:[],b:[]},ln:[0,1,2].map(()=>({a:[],b:[]})),cp:{a:[0,0,0],b:[0,0,0]},turn:'a',q:[],wt:null,log:['ルーム作成'],win:null,act:'a',ok:0,sc:'',cn:0,cl:''}}
const W=(s,o)=>{s.wt={src:s.sc,...o}};
function draw(s,p,n){for(;n>0;n--){if(!s.deck[p].length){if(!s.dis[p].length)break;s.deck[p]=sh(s.dis[p]);s.dis[p]=[]}s.hand[p].push(s.deck[p].pop())}}
function setup(s){['a','b'].forEach(p=>{s.deck[p]=sh(s.pr[p].flatMap(n=>Object.keys(C).filter(id=>C[id].p==n)));draw(s,p,5)});s.ph='play';s.turn='a';lg(s,'バトル開始');begin(s)}
function trig(s,p,k){const q=[];s.ln.forEach(l=>{const r=l[p];r.forEach((e,j)=>{const c=C[e.c];if(e.u&&c[k]&&(c.sp=='t'||j==r.length-1))q.push(...c[k])})});return q}
function begin(s){const q0=trig(s,s.turn,'st');if(q0.length){s.act=s.turn;s.q=q0;s.cont='start';s.sc='';lg(s,'開始効果が発動');run(s);return}begin2(s)}
function begin2(s){s.rv=null;const p=s.turn,o=opp(p);const ok=[0,1,2].filter(i=>{const t=tot(s,i,p);return t>=10&&t>tot(s,i,o)});
 if(s.nc==p){ok.length=0;s.nc=null}s.sc='';if(ok.length==1)comp(s,ok[0]);else if(ok.length)W(s,{who:p,k:'comp',opts:ok});else W(s,{who:p,k:'act'})}
function comp(s,i){const p=s.turn,o=opp(p);['a','b'].forEach(x=>{s.ln[i][x].forEach(e=>s.dis[e.o].push(e.c));s.ln[i][x]=[]});
 if(s.cp[p][i]){if(s.deck[o].length)s.hand[p].push(s.deck[o].pop())}else s.cp[p][i]=1;
 lg(s,s.names[p]+' が '+s.pr[p][i]+' をコンパイル!');s.cn=(s.cn||0)+1;s.cl=s.names[p]+' // '+s.pr[p][i];s.cpn=s.pr[p][i];if(s.cp[p].every(x=>x)){s.win=p;s.wt=null;return}fin(s)}
function fin(s){const q0=trig(s,s.turn,'en');if(q0.length){s.act=s.turn;s.q=q0;s.cont='end';s.sc='';lg(s,'終了効果が発動');run(s);return}fin2(s)}
function fin2(s){const p=s.turn;s.sc='';if(s.hand[p].length>5){W(s,{who:p,k:'disc',cache:1,n:1});return}s.turn=opp(p);begin(s)}
function run(s){s.wt=null;while(s.q.length){let op=s.q.shift();const p=s.act,o=opp(p);
 if(op[0]=='~'){W(s,{who:p,k:'opt',op:op.slice(1)});return}
 if(op=='RV'){s.rv={own:o,h:[...s.hand[o]]};continue}
 if(op=='TD'){if(s.deck[p].length){const c=s.deck[p].pop();s.dis[p].push(c);draw(s,p,C[c].v)}continue}
 if(op=='SHF'){s.deck[p]=sh([...s.deck[p],...s.dis[p]]);s.dis[p]=[];continue}
 if(op=='ZA'){['a','b'].forEach(x=>{s.dis[x].push(...s.hand[x]);s.hand[x]=[]});continue}
 if(op=='RC'){const n=s.hand[p].length;s.dis[p].push(...s.hand[p]);s.hand[p]=[];draw(s,p,n);continue}
 if(op=='FSELF'){s.ln.forEach(l=>['a','b'].forEach(x=>l[x].forEach(e=>{if(e.c==s.sc)e.u=e.u?0:1})));continue}
 if(op=='NC'){s.nc=o;continue}
 if(op=='SHSELF'){let f=null;s.ln.forEach((l,i)=>['a','b'].forEach(x=>{const r=l[x];if(r.length&&r[r.length-1].c==s.sc)f=[i,x]}));if(f){W(s,{who:p,k:'dst',from:f});return}continue}
 if(op=='H0D1'){if(!s.hand[p].length)draw(s,p,1);continue}
 if(op=='OP1'){if(s.deck[p].length)s.hand[o].push(s.deck[p].pop());continue}
 if(op=='DO1'){if(s.deck[o].length)s.hand[p].push(s.deck[o].pop());continue}
 if(op=='OR1'){const h=s.hand[o];if(h.length)s.dis[o].push(h.splice(Math.random()*h.length|0,1)[0]);continue}
 if(op=='FAL'||op=='FAB'){[0,1,2].forEach(i=>{if(op=='FAL'&&i!=s.li)return;['a','b'].forEach(x=>s.ln[i][x].forEach(e=>{if(e.u&&e.c!=s.sc)e.u=0}))});continue}
 if(op[0]=='D'&&op[1]!='E'){draw(s,p,+op.slice(1));continue}
 if(op.startsWith('OD')){draw(s,o,+op.slice(2));continue}
 if(op=='RF'){if(s.hand[p].length<5)draw(s,p,5-s.hand[p].length);continue}
 if(op[0]=='X'){s.ok=0;if(s.hand[p].length){W(s,{who:p,k:'disc',n:+op[1]});return}continue}
 if(op[0]=='O'){if(s.hand[o].length){W(s,{who:o,k:'disc',n:+op[1],by:p});return}continue}
 if(op[0]=='?'){if(!s.ok)continue;op=op.slice(1)}
 const f=FT[op];if(!f)continue;const opts=[];
 [0,1,2].forEach(i=>['a','b'].forEach(x=>{const r=s.ln[i][x],e=r[r.length-1];if(e&&f(e,x,p,s))opts.push([i,x])}));
 if(!opts.length)continue;W(s,{who:p,k:'tgt',op,opts});return}
 after(s)}

function uncover(s,r){const n=r[r.length-1];if(n&&n.u)s.q.unshift(...C[n.c].o)}
function pickTgt(s,i,x){const w=s.wt,r=s.ln[i][x],e=r[r.length-1],p=w.who;
 if(w.op[0]=='F'){e.u=e.u?0:1;lg(s,C[e.c].p+C[e.c].v+' を'+(e.u?'表':'裏')+'向きに');if(e.u)s.q.unshift(...C[e.c].o)}
 else if(w.op[0]=='S'){W(s,{who:p,k:'dst',from:[i,x]});return}
 else{r.pop();const d=w.op[0]=='D';(d?s.dis[e.o]:s.hand[e.o]).push(e.c);lg(s,C[e.c].p+C[e.c].v+(d?' を削除':' を手札へ戻した'));uncover(s,r)}
 run(s)}

function disc(s,idx){const w=s.wt,p=w.who;s.dis[p].push(s.hand[p].splice(idx,1)[0]);
 if(w.cache){if(s.hand[p].length>5)return;s.turn=opp(p);s.wt=null;begin(s);return}
 if(p==s.act)s.ok=1;if(w.n>1&&s.hand[p].length){s.wt={...w,n:w.n-1};return}run(s)}
function why(s,p,id,i,up){const o=opp(p),c=C[id],own=s.ln.flatMap(l=>l[p]),en=s.ln[i][o];
 if(!up){if(s.ln[i][o].some(e=>e.u&&e.c=='Metal2')&&s.ln[i][o][s.ln[i][o].length-1].c=='Metal2'||fu(en,'Metal2'))return 'このラインには Metal 2 の効果で裏向きでは出せません';}
 else{if(s.ln.some(l=>fu(l[o],'Psychic1')))return 'Psychic 1 の効果で、相手は裏向きでしかカードを出せません(あなたのことです)';
  if(c.p!=s.pr[p][i]&&!fu(own,'Spirit1')&&id!='Chaos3')return '表向きは、そのカードのプロトコル('+c.p+')のラインにしか出せません。裏向きなら任意のラインに出せます'}
 const t=en[en.length-1];if(t&&t.u&&t.c=='Plague0')return 'Plague 0 の効果で、このラインにはカードを出せません';return''}
function play(s,p,idx,i,up){const id=s.hand[p].splice(idx,1)[0];const rr=s.ln[i][p],u0=rr[rr.length-1],cv=u0&&u0.u&&C[u0.c].cv||[];s.ln[i][p].push({c:id,u:up,o:p});s.act=p;s.sc=id;s.li=i;s.ev=(s.ev||0)+1;s.evt=up?id+' 発動 — '+(C[id].m||C[id].t||'効果なし'):s.names[p]+' が裏向きでプレイ';s.q=[...cv,...(up?C[id].o:[])];
 lg(s,s.names[p]+' が '+(up?id+' を表向きでプレイ':'カードを裏向きでプレイ'));run(s)}
function refresh(s,p){if(!(s.wt&&s.wt.who==p&&s.wt.k=='act'))return;draw(s,p,5-s.hand[p].length);lg(s,s.names[p]+' がリフレッシュ');fin(s)}
/* ===== 通信 ===== */
let trs='',myName='',me=null,ref=null,S=null,sel=-1,down=false,unsub=null,det=null,db;const $=id=>document.getElementById(id);
async function tx(fn,force){const v0=S?(S.v||0):0;try{await db.runTransaction(async t=>{const d=await t.get(ref);if(!d.exists)throw Error('部屋が存在しません');const s=JSON.parse(d.data().s);if(!force&&(s.v||0)!==v0)return;fn(s);s.v=(s.v||0)+1;t.set(ref,{s:JSON.stringify(s),t:Date.now()})})}catch(e){alert('通信エラー: '+e.message)}}
async function join(){const room=$('room').value.trim(),name=$('name').value.trim();if(!room||!name)return alert('部屋IDと名前を入力してください');
 const sets=[...document.querySelectorAll('.ck input:checked')].map(x=>x.value);if(!sets.length)return alert('使うセットを1つ以上選んでください');
 ref=db.collection(COL).doc(room);
 try{await db.runTransaction(async t=>{const d=await t.get(ref);let s;
  if(!d.exists){s=blank(sets);s.names.a=name;me='a'}
  else{s=JSON.parse(d.data().s);if(nm(s.names.a)==nm(name))me='a';else if(!s.names.b){s.names.b=name;me='b';s.ph='draft'}else if(nm(s.names.b)==nm(name))me='b';else throw Error('この部屋は満員です。参加者: '+s.names.a+' / '+s.names.b+'(同じ名前で入ると再入室できます)')}
  t.set(ref,{s:JSON.stringify(s),t:Date.now()})})}catch(e){return alert(e.message)}
 myName=nm(name);try{localStorage.setItem('cp',JSON.stringify({room,name}))}catch(e){}
 unsub=ref.onSnapshot(d=>{if(d.exists){const old=S;S=JSON.parse(d.data().s);if(old&&(S.gid!=old.gid||nm(S.names[me]||'')!=myName)){S=null;me=null;unsub&&unsub();return lobby('部屋がリセットされました。もう一度入室してください。')}const cc=old&&S.cn>(old.cn||0);if(cc)fx(S.cl,S.cpn);if(old&&S.ev>(old.ev||0)&&!cc)toast(S.evt);if(old&&S.win&&!old.win)setTimeout(()=>end(S.win==me),cc?2900:0);R()}else if(S){S=null;me=null;unsub&&unsub();lobby('部屋がリセットされました。同じ部屋IDで入り直せます。')}})}
async function resetRoom(){if(confirm('ゲームを強制終了して部屋を削除します。相手の画面も入室画面に戻ります。よろしいですか?'))try{await ref.delete()}catch(e){alert('削除に失敗: '+e.message)}}
/* ===== 描画 ===== */
const th=p=>`--c:${TH[p][0]};--b:${TH[p][1]}`;
function big(id,cls,attr){const c=C[id],T=(x,l,k,ok)=>x?`<div class="sx ${k}"><u>${l}</u>${esc(x)}${ok?'':'<s>未実装</s>'}</div>`:'';
 return`<div class="hc holo pi p-${c.p} ${cls}" style="${th(c.p)}" ${attr||''}><div class="hd"><span>${c.p}</span><b>${c.v}</b></div>${T(c.t,'上段 常に有効','t',c.ti)}${T(c.m,'中段 出した時','m',c.mi)}${T(c.b,'下段 条件で発動','b',c.bi)}</div>`}
function lobby(note){$('app').innerHTML=`<h1 class="o">COMPILE</h1><div class="bar">PROTOCOL BATTLE // 1 vs 1</div>${note?`<div class="st">${note}</div>`:''}<div class="box pi p-${rk()}"><label>ROOM ID</label><input type="text" id="room" placeholder="例: room1" autocomplete="off"><label>NAME</label><input type="text" id="name" placeholder="あなたの名前" autocomplete="off"><div class="ck" style="margin:8px 0">使うセット(部屋を作る人の設定が有効):<br><label><input type="checkbox" value="m1" checked> Main 1</label><label><input type="checkbox" value="a1" checked> Aux 1</label><label><input type="checkbox" value="m2" checked> Main 2</label></div><button onclick="join()">ENTER ROOM</button><div style="color:var(--dim);margin-top:8px">同じ部屋IDを入れた2人で対戦します。切断しても同じ名前で入り直せば再開できます。</div></div>`;try{const c=JSON.parse(localStorage.getItem('cp'));if(c){$('room').value=c.room;$('name').value=c.name}}catch(e){}}
function R(){const A=$('app');if(!S)return;const s=S,o=opp(me),H=s.hand[me],w=s.wt,mine=w&&w.who==me&&!s.win;tn(s,o);
 let h=`<div class="bar o"><span>ROOM ${esc(ref.id)}</span><span>YOU: ${esc(s.names[me])} / FOE: ${esc(s.names[o]||'待機中…')}</span><button data-a="fix">操作が止まった時の復旧</button><button class="m" data-a="reset">強制終了・部屋リセット</button></div>`;
 if(s.ph=='wait')return A.innerHTML=h+'<div class="box">対戦相手の入室を待っています。同じ部屋IDで相手に入室してもらってください。</div>';
 if(s.ph=='draft'){const cur=ORD[s.pk];
  h+=`<div class="st ${cur==me?'me':''}"><b>プロトコル選択</b>(先手1→後手2→先手2→後手1) — ${cur==me?'あなたの番です。1つ選んでください':esc(s.names[cur])+' が選択中'}</div><div class="box pk">`+s.pool.map(n=>`<button class="pb pi p-${n}" title="${esc(TR[n]||'')}" data-pk="${n}" style="${th(n)}">${TH[n][2]} ${n}</button>`).join('')+'</div><div class="box" id="trb">'+(trs&&TR[trs]?'<b>'+trs+'</b><br>'+esc(TR[trs]):'プロトコルにカーソルを合わせる(またはタップ)と特色が表示されます')+'</div>'+['a','b'].map(p=>`<div>${esc(s.names[p])}: ${s.pr[p].join(' / ')||'-'}</div>`).join('');return A.innerHTML=h}
 let msg='';const src=w&&w.src&&C[w.src]?`<b>${w.src}</b> の効果:`:'';
 if(s.win)msg=s.win==me?'<b>🏆 勝利!</b> 全プロトコルをコンパイルしました。「強制終了・部屋リセット」で次の対戦へ':'<b>敗北…</b> 相手が全プロトコルをコンパイルしました';
 else if(!w)msg='処理中…';else if(!mine)msg=esc(s.names[w.who])+' の操作を待っています';
 else msg={act:'<b>あなたの行動:</b> ①手札を選び、出したいラインの自分側を押す ②またはリフレッシュ',comp:'<b>コンパイル!</b> 光っているラインの「コンパイル」ボタンを押してください',disc:`${src} <b>${w.cache?'手札が6枚以上です。5枚になるまで':''}手札から捨てるカードを選んでください</b>`,tgt:`${src} <b>${PT[w.op]}</b>(光っているカードを押す)`,opt:`${src} <b>任意の効果: ${PT[w.op]||'捨て札を山札に混ぜる'}</b> を実行しますか?`,dst:`${src} <b>移動先のラインを選んでください</b>(光っている自分/相手側の枠を押す)`}[w.k];
 h+=`<div class="st ${mine?'me':''}">${s.turn==me?'【あなたのターン】':'【相手のターン】'} ${msg}</div>`;
 if(mine&&w.k=='opt')h+='<div><button data-o="1">実行する</button><button class="m" data-o="0">実行しない</button></div>';if(s.rv)h+=`<div class="box">公開中: ${esc(s.names[s.rv.own])} の手札 — ${s.rv.h.join(', ')||'なし'}</div>`;
 h+='<div class="bar"><span>相手 手札 '+s.hand[o].length+' / 山札 '+s.deck[o].length+' / 捨札 '+s.dis[o].length+'</span><span>自分 山札 '+s.deck[me].length+' / 捨札 '+s.dis[me].length+'</span></div><div class="g">';
 for(let i=0;i<3;i++){const tm=tot(s,i,me),to=tot(s,i,o),cl=mine&&w.k=='comp'&&w.opts.includes(i);
  const st=x=>s.ln[i][x].map((e,j,r)=>{const t=j==r.length-1,hit=mine&&w.k=='tgt'&&t&&w.opts.some(q=>q[0]==i&&q[1]==x),c=C[e.c],v=e.u||x==me;
   return`<div class="cd holo ${e.u?'pi p-'+c.p:'dn'} ${t?'top':''} ${hit?'hit':''}" style="${th(c.p)}" ${hit?`data-t="${i},${x}"`:v?`data-d="${e.c}"`:''}><span class="ic">${v?TH[c.p][2]:''}</span><b>${val(e)}</b><em>${v?c.p+' '+c.v:'裏'}${!e.u&&v?'(伏)':''}</em>${e.u&&(t||c.t)?`<div class="ft">${esc(t?[c.t&&'上段:'+c.t,c.m&&'中段:'+c.m,c.b&&'下段:'+c.b].filter(Boolean).join(' / '):'上段:'+c.t)}</div>`:''}</div>`}).join('');
  const pr=x=>`<div class="pr pi p-${s.pr[x][i]} ${s.cp[x][i]?'done':''}" style="${th(s.pr[x][i])}">${s.pr[x][i]}${s.cp[x][i]?'<small class="ld">COMPILED</small>':'<small class="ld">Loading...</small>'}</div>`;
  const dl=mine&&w.k=='dst'&&w.from[0]!=i&&true,dlx=x=>dl&&x==w.from[1]&&w.from[0]!=i;
  const pl=mine&&w.k=='act';
  h+=`<div class="col" ${pl?`data-pl="${i}"`:''}><div class="half ${dlx(o)?'hit':''}" ${dlx(o)?`data-dl="${i}"`:''}>${pr(o)}${st(o)}</div>
  <div class="sc">${to} <span style="color:var(--ln)">|</span> <b class="${tm>=10&&tm>to?'ok':''}">${tm}</b>${cl?`<br><button class="m" data-cp="${i}">コンパイル</button>`:''}</div>
  <div class="half mine ${(pl&&sel>=0)||dlx(me)?'hit':''}" ${dlx(me)?`data-dl="${i}"`:''}>${pr(me)}${st(me)}</div></div>`}
 h+='</div>';
 if(mine&&w.k=='act')h+=`<div class="ck"><button data-a="ref" ${H.length>=5?'disabled':''}>リフレッシュ(手札5枚未満の時だけ)</button><label><input type="checkbox" id="dn" ${down?'checked':''}> 裏向きで出す(値2・どのラインでも可)</label>${!H.length&&!s.deck[me].length&&!s.dis[me].length?'<button data-a="pass">パス</button>':''}</div>`;
 h+='<div class="hand">'+H.map((id,k)=>big(id,k==sel?'sel':'',`data-h="${k}" draggable="true"`)).join('')+'</div>';
 if(det)h+=`<div class="box dt">${big(det,'nb')}<div>カード詳細(場のカードを押すと表示)<br><button data-a="cl">閉じる</button></div></div>`;
 h+=`<div class="box"><b>プロトコル特色</b>(押すと表示)<br>${[...s.pr[me],...s.pr[o]].map(n=>`<button class="pb2" data-tr="${n}" style="${th(n)}">${n}</button>`).join('')}<div id="trb" style="margin-top:6px">${trs&&TR[trs]?`<b>${trs}</b><br>`+esc(TR[trs]):''}</div></div>`;
 h+='<div class="box log">'+s.log.slice().reverse().map(esc).join('<br>')+'</div>';A.innerHTML=h}
document.addEventListener('click',e=>{const t=e.target.closest('[data-pk],[data-t],[data-cp],[data-pl],[data-h],[data-a],[data-dl],[data-d],[data-o],[data-tr]');if(!t||!S||!me)return;const s=S,w=s.wt,mine=w&&w.who==me&&!s.win;
 if(mine&&w.k=='act'&&sel>=0&&!e.target.closest('[data-h],[data-a],label')){const L=e.target.closest('[data-pl]');if(L)return doPlay(+L.dataset.pl)}
 if(t.dataset.a=='reset')return resetRoom();
 if(t.dataset.a=='fix')return tx(s=>{s.q=[];s.cont='';s.rv=null;if(s.ph=='play'&&!s.win){s.sc='';if(s.hand[s.turn].length>5)W(s,{who:s.turn,k:'disc',cache:1,n:1});else W(s,{who:s.turn,k:'act'})}},1);if(t.dataset.a=='cl'){det=null;return R()}
 if(t.dataset.pk){if(ORD[s.pk]!=me)return;const n=t.dataset.pk;return tx(s=>{if(ORD[s.pk]!=me)return;s.pr[me].push(n);s.pool=s.pool.filter(x=>x!=n);s.pk++;if(s.pk>=6)setup(s)})}
 if(t.dataset.d&&!(mine&&t.dataset.t)){det=t.dataset.d;return R()}
 if(t.dataset.tr){trs=t.dataset.tr;return R()}
 if(!mine)return;
 if(t.dataset.o!==undefined){const y=t.dataset.o=='1';return tx(s=>{const op=s.wt.op;s.wt=null;if(y)s.q.unshift(op);run(s)})}
 if(t.dataset.t){const[i,x]=t.dataset.t.split(',');return tx(s=>pickTgt(s,+i,x))}
 if(t.dataset.dl)return tx(s=>dstTo(s,+t.dataset.dl));
 if(t.dataset.cp)return tx(s=>comp(s,+t.dataset.cp));
 if(t.dataset.h!==undefined){const k=+t.dataset.h;if(w.k=='disc')return tx(s=>disc(s,k));if(w.k=='act'){sel=sel==k?-1:k;R()}return}
 if(t.dataset.pl!==undefined){const i=+t.dataset.pl,id=s.hand[me][sel],up=!$('dn')?.checked,er=why(s,me,id,i,up);if(er)return alert(er);down=!up;const k=sel;sel=-1;return tx(s=>play(s,me,k,i,up))}
 if(t.dataset.a=='ref')return tx(s=>refresh(s,me));
 if(t.dataset.a=='pass')return tx(s=>{s.turn=opp(me);begin(s)})});
document.addEventListener('change',e=>{if(e.target.id=='dn')down=e.target.checked});
function fx(sub,pn){const f=$('fx');let hx='';for(let i=0;i<30;i++)hx+=Array.from({length:8},()=>Math.random().toString(16).slice(2,6).toUpperCase()).join(' ')+'<br>';
 f.innerHTML=`${IM[pn]?`<div class="bgi" style="background-image:url(${IM[pn]})"></div>`:''}<div class="hx">${hx}${hx}</div><div class="cm"><div class="gl">COMPILE</div><div class="sb">${esc(sub)}</div></div><i class="sl"></i>`;f.className='on';setTimeout(()=>{f.className='';f.innerHTML=''},2800)}
(function(){const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.id='bg';s.setAttribute('viewBox','-500 -500 1000 1000');s.setAttribute('preserveAspectRatio','xMidYMid slice');let h='';
 [[90,6,0],[170,8,10],[260,6,25],[350,12,0],[460,6,30]].forEach(([r,n,o],k)=>{const P=[...Array(n)].map((_,i)=>{const a=(i/n+o/360)*6.2832;return[(r*Math.cos(a)).toFixed(1),(r*Math.sin(a)).toFixed(1)]});
 h+=`<g style="animation-duration:${60+k*25}s;animation-direction:${k%2?'reverse':'normal'}"><polygon points="${P.map(p=>p.join(',')).join(' ')}"/>${k%2?'':P.map(p=>`<line x1="0" y1="0" x2="${p[0]}" y2="${p[1]}"/>`).join('')}</g>`});s.innerHTML=h;document.body.prepend(s)})();
function tn(s,o){let d=0,l=0;for(let i=0;i<3;i++){const m=tot(s,i,me),q=tot(s,i,o);if(q>=8&&q>m)d=Math.max(d,q>=10?2:1);if(m>=8&&m>q)l=Math.max(l,m>=10?2:1)}document.body.dataset.tn=d?'d'+d:l?'l'+l:''}
function toast(x){const n=document.createElement('div');n.className='ts';n.textContent='▶ '+x;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
function end(w){const f=$('fx');let hx='';for(let i=0;i<40;i++)hx+=Array.from({length:8},()=>Math.random().toString(16).slice(2,6).toUpperCase()).join(' ')+'<br>';
 f.className='on end '+(w?'win':'lose');f.style.pointerEvents='auto';f.onclick=()=>{f.className='';f.innerHTML='';f.style.pointerEvents='none'};
 f.innerHTML=w?'<i class="ray"></i><i class="rg"></i><i class="rg r2"></i><div class="cm"><div class="gl">VICTORY</div><div class="sb">ALL PROTOCOLS COMPILED</div><div class="sb s2">CLICK TO CLOSE</div></div>':`<div class="hx">${hx}${hx}</div><div class="cm"><div class="gl">BREACHED</div><div class="sb">YOUR PROTOCOLS HAVE BEEN HACKED</div><pre class="tm">&gt; root access granted to opponent\n&gt; overwriting protocol stack ...\n&gt; ACCESS DENIED // YOU LOSE</pre><div class="sb s2">CLICK TO CLOSE</div></div>`}
function doPlay(i){const s=S,id=s.hand[me][sel];if(!id)return;const up=!$('dn')?.checked,er=why(s,me,id,i,up);if(er)return toast(er);down=!up;const k=sel;sel=-1;tx(s=>play(s,me,k,i,up))}
document.addEventListener('dragstart',e=>{const h=e.target.closest('[data-h]');if(h){sel=+h.dataset.h;e.dataTransfer.setData('text','c')}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-pl]'))e.preventDefault()});
document.addEventListener('drop',e=>{const L=e.target.closest('[data-pl]');if(L&&sel>=0){e.preventDefault();doPlay(+L.dataset.pl)}});
const rk=()=>Object.keys(IM)[Math.random()*Object.keys(IM).length|0];
(function(){let c='';for(const k in IM)c+=`.p-${k}::before{background-image:url(${IM[k]})}`;const s=document.createElement('style');s.textContent=c;document.head.appendChild(s)})();
if(CFG.apiKey==="YOUR_API_KEY")$('app').innerHTML='<h1>COMPILE</h1><div class="box">このファイル内の <code>CFG</code>(Firebase設定値)を書き換えてから使ってください。</div>';
else{firebase.initializeApp(CFG);db=firebase.firestore();lobby()}
